services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fp
      POSTGRES_PASSWORD: fp
      POSTGRES_DB: financial_platform
    ports:
      - "55432:5432"
    volumes:
      - fp_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fp -d financial_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fp_pg:
